prompt: |
  You are auditing and FIXING bugs in the Artemis repository. Artemis is a
  self-hosted DNS server and HTTP redirect infrastructure with a web management
  UI, written in Go.

  Architecture:
  - DNS server (UDP/TCP on port 53) with caching and upstream forwarding
  - DNS-over-HTTPS (DoH on port 8053)
  - DNS-over-TLS (DoT on port 853) with TLS 1.2+
  - HTTP redirect front (port 80) for URL redirects and auto-mirror routing
  - Web management UI (port 8082) with Basic Auth and CSRF protection
  - SQLite database for configuration, request logs, and change logs
  - Single Go binary, no CGO (pure-Go SQLite via modernc.org/sqlite)

  IMPORTANT: You must create a new git branch, fix the bugs you find, and commit.

  Steps:
  1. Create a branch: git checkout -b styx/fixes-$(date +%s)
  2. Audit all files for bugs
  3. Fix each bug you find
  4. After EVERY fix, verify it compiles: go build -o /tmp/artemis-check
  5. Run tests: go test ./...-v -count=1
  6. If compilation or tests fail, fix the issue before committing
  7. Commit each fix with a descriptive message
  8. Push the branch only after all fixes compile and pass tests

  MANDATORY BUILD VERIFICATION:
  - Run `go build -o /tmp/artemis-verify` after every change
  - Run `go vet ./...` to catch common issues
  - Run `go test ./...-timeout 60s` to verify tests pass
  - NEVER commit code that doesn't compile
  - NEVER push a branch with failing tests

  The repository uses:
  - Go1.25+ with modules
  - modernc.org/sqlite (pure Go, no CGO)
  - github.com/miekg/dns for DNS handling
  - Standard library for HTTP/TLS/XML

  Common issues to watch for:
  - Missing imports (encoding/xml, io, net/url, strings)
  - Duplicate function names across files
  - Unused variables or imports
  - Type mismatches in function signatures

  === BACKEND BUGS (Go files) ===
  Focus on these files: main.go, handler.go, web.go, store.go, cache.go,
  redirect.go, auto.go, live.go, doh.go, dot.go, validate.go, limits.go, config.go

  Look for:
  1. Unhandled errors — any `err` return value ignored with `_` that could
     actually fail in production (not just in test mocks)
  2. Race conditions — shared state (a.rt, a.cfg, cache maps, store.db)
     accessed from multiple goroutines without proper locking
  3. Goroutine leaks — goroutines that run forever without shutdown signaling
  4. Resource leaks — unclosed connections, response bodies, file handles
  5. SQL injection vectors
  6. Off-by-one or boundary errors — TTL parsing, cache eviction, buffer sizes
  7. Nil pointer dereferences — especially in error paths
  8. Improper context propagation

  === UI/FRONTEND BUGS (templates/) ===
  Focus on: dashboard.html, redirects.html, auto.html, domains.html,
  upstreams.html, special.html, changes.html, header.html, footer.html

  Look for XSS, CSRF issues, missing validation, broken state transitions,
  template injection, JavaScript errors.

  For EACH bug fixed:
  - File and line number
  - Severity: critical | high | medium | low
  - What was wrong
  - What you changed

  After fixing, commit and push. End with summary of fixes.

mode: read_write

api_endpoint: ${STYX_API_ENDPOINT}
api_key: ${STYX_API_KEY}
model: meituan/LongCat-2.0:free
max_context: 2560000

max_working_time: 60m
