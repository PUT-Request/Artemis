{{define "header.html"}}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artemis DNS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  <style>
    body { background:#0d1117; }
    thead { background-color: var(--bs-tertiary-bg); }
    .navbar-brand { font-weight:700; letter-spacing:.2px; }
    .card { border:1px solid var(--bs-border-color); box-shadow:0 1px 3px rgba(0,0,0,.4); }
    .stat-num { font-size:1.6rem; font-weight:700; }
    .navbar .nav-link.active { font-weight:600; }
    table td { vertical-align:middle; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85em; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-hdd-network me-2"></i>Artemis</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        {{$a := .Active}}
        <li class="nav-item"><a class="nav-link {{if eq $a "dashboard"}}active{{end}}" href="/">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "upstreams"}}active{{end}}" href="/upstreams">Upstreams</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "special"}}active{{end}}" href="/special">Live Decoding</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "redirects"}}active{{end}}" href="/redirects">Redirects</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "domains"}}active{{end}}" href="/domains">Domains</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "auto"}}active{{end}}" href="/auto">Auto</a></li>
        <li class="nav-item"><a class="nav-link {{if eq $a "changes"}}active{{end}}" href="/changes">Changes</a></li>
      </ul>
      <form method="post" action="/restart" class="d-flex">
        <input type="hidden" name="csrf" value="{{.CSRF}}">
        <button class="btn btn-sm btn-outline-light" type="submit" title="Stop & rebind listeners">
          <i class="bi bi-arrow-clockwise me-1"></i>Restart
        </button>
      </form>
      <span class="navbar-text ms-3 text-white-50"><i class="bi bi-person"></i> {{.User}}</span>
    </div>
  </div>
</nav>
<main class="container-fluid px-4">
{{if .Err}}
<div class="alert alert-danger alert-dismissible fade show" role="alert">
  {{.Err}}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{{end}}
{{end}}
