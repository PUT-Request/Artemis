name: Styx Audit

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Styx
        run: curl -sL https://styx-44p.pages.dev/styx-linux-amd64 -o styx-linux-amd64

      - name: Make executable
        run: chmod +x styx-linux-amd64

      - name: Run Styx audit
        env:
          STYX_API_KEY: ${{ secrets.STYX_API_KEY }}
          STYX_API_ENDPOINT: ${{ secrets.STYX_API_ENDPOINT }}
          STYX_DISCORD_WEBHOOK: ${{ secrets.STYX_DISCORD_WEBHOOK }}
        run: ./styx-linux-amd64 --run styx.yaml
